<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f766e">
  <title>MedBot | Medical knowledge assistant</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="app-shell">
    <section class="chat-card" aria-label="Medical chatbot">
      <header class="chat-header">
        <div class="brand-mark" aria-hidden="true">+</div>
        <div class="brand-copy">
          <p class="eyebrow">Medical knowledge assistant</p>
          <h1>MedBot</h1>
        </div>
        <span class="service-badge"><span></span> RAG enabled</span>
      </header>

      <div id="messages" class="messages" aria-live="polite" aria-relevant="additions">
        <article class="message message--bot">
          <div class="avatar" aria-hidden="true">M</div>
          <div>
            <p class="message-label">MedBot</p>
            <div class="bubble">Hello ? I can answer questions using the medical documents in my knowledge base. Ask a clear question to get started.</div>
          </div>
        </article>
      </div>

      <form id="chat-form" class="chat-form" novalidate>
        <label class="sr-only" for="message">Your medical question</label>
        <input id="message" name="msg" type="text" maxlength="2000" autocomplete="off" placeholder="Ask a medical question?" required>
        <button id="submit-button" type="submit">
          <span>Send</span><span aria-hidden="true">?</span>
        </button>
      </form>
      <p id="feedback" class="feedback" role="status"></p>
      <p class="disclaimer">MedBot can make mistakes and is not a substitute for a licensed medical professional.</p>
    </section>
  </main>

  <script>
    const form = document.getElementById('chat-form');
    const input = document.getElementById('message');
    const messages = document.getElementById('messages');
    const submitButton = document.getElementById('submit-button');
    const feedback = document.getElementById('feedback');

    function addMessage(role, text) {
      const article = document.createElement('article');
      article.className = `message message--${role}`;

      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.setAttribute('aria-hidden', 'true');
      avatar.textContent = role === 'user' ? 'You' : 'M';

      const content = document.createElement('div');
      const label = document.createElement('p');
      label.className = 'message-label';
      label.textContent = role === 'user' ? 'You' : 'MedBot';

      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;

      content.append(label, bubble);
      article.append(avatar, content);
      messages.append(article);
      messages.scrollTop = messages.scrollHeight;
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const message = input.value.trim();
      if (!message || submitButton.disabled) return;

      addMessage('user', message);
      input.value = '';
      input.disabled = true;
      submitButton.disabled = true;
      feedback.textContent = 'Searching the medical knowledge base?';

      try {
        const response = await fetch('/get', { method: 'POST', body: new FormData(form) });
        const answer = (await response.text()).trim();
        if (!response.ok) throw new Error(answer || 'The service could not complete that request.');
        addMessage('bot', answer);
        feedback.textContent = '';
      } catch (error) {
        addMessage('bot', error.message || 'The service could not complete that request.');
        feedback.textContent = 'You can try your question again in a moment.';
      } finally {
        input.disabled = false;
        submitButton.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
